spring.application.name=injuryvision

# --- Database ---
# Env-driven so the same build runs locally (H2 fallback) and on Render (Postgres).
# On Render set DB_URL / DB_USERNAME / DB_PASSWORD. Driver is auto-detected from the URL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:injuryvision;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console (dev only) — http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Server port: Render injects PORT; defaults to 8080 locally ---
server.port=${PORT:8080}

# --- JWT (override JWT_SECRET in production; min 32 chars) ---
jwt.secret=${JWT_SECRET:injuryvision-dev-secret-change-before-production-min-32-chars}
jwt.expiration-ms=86400000

# --- CORS allowed origin(s); comma-separated. Set FRONTEND_URL on Render to your Vercel URL ---
# (read in SecurityConfig)
