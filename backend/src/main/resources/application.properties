spring.application.name=injuryvision

# --- Database (dev: H2 in-memory) ---
# Switch to PostgreSQL later by overriding these properties or using a profile.
spring.datasource.url=jdbc:h2:mem:injuryvision;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console (dev only) — http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JWT (change secret in production) ---
jwt.secret=injuryvision-dev-secret-change-before-production-min-32-chars
jwt.expiration-ms=86400000

